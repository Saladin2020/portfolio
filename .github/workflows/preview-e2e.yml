# Runs Playwright + axe + Lighthouse (lab) against the real Vercel PREVIEW once Vercel reports it
# ready. Complements ci.yml, which tests a local `next start` build. ARCHITECTURE.md §10.3.
#
# ── Trigger and secrets (security review F-09) ─────────────────────────────────────────────────
# * This uses `deployment_status`. GitHub always runs the copy of this file on the DEFAULT branch,
#   with the repository's secrets and a GITHUB_TOKEN limited by `permissions:` below. That holds
#   whether the deployment came from a same-repo branch or a FORK PR. GitHub's fork rule ("secrets
#   are not passed to fork runs; GITHUB_TOKEN is read-only") applies to the `pull_request` event
#   only; it does NOT protect this workflow.
# * `pull_request_target` likewise runs with secrets and must never be used to check out or run
#   untrusted PR code. It is not used here.
# * This job DOES check out and run PR-head code (`github.event.deployment.sha`): `npm ci` install
#   scripts, playwright.config.ts, global-setup.ts and the tests. Any code in that commit could read
#   the bypass secret on the steps where it is present. Mitigations, all required:
#     1. Vercel Git Fork Protection stays ON (default). Fork PRs are not deployed until a Vercel team
#        member authorizes them, so no deployment_status event exists for an unreviewed fork.
#     2. The job only runs for deployments created by the Vercel GitHub App (creator vercel[bot]).
#     3. The secret is scoped to the three steps that need it, NOT job-wide. `npm ci` and
#        `playwright install` never see it.
#     4. `permissions: contents: read` only.
#   Repo setting "Require approval for fork PR workflows" governs `pull_request` runs (ci.yml),
#   not this workflow, so it is not a substitute for (1).
#
# ── Secret hygiene (security review F-08) ──────────────────────────────────────────────────────
# * Playwright: the secret goes only to tests/global-setup.ts, which trades it for a bypass cookie
#   saved in $RUNNER_TEMP (outside the workspace). It is never in `extraHTTPHeaders`. Traces,
#   video, screenshots and the HTML report are OFF (forced here with --trace=off/--reporter, and
#   in the config).
# * Lighthouse: the header is injected into a config file in $RUNNER_TEMP (mode 600) that is
#   deleted afterwards. LHRs in .lighthouseci/ contain `configSettings.extraHeaders`, so they are
#   NEVER uploaded and are deleted in the cleanup step. No `lhci upload` / temporary-public-storage.
# * Uploads: only pw-junit.xml and .lighthouseci/assertion-results.json are copied to a staging
#   dir, and a tripwire step fails the job (and uploads nothing) if the secret value, the header
#   name or the `_vercel_jwt` cookie appears in them. Retention 1 day.
# * GitHub masks `secrets.*` in logs; the presence step also registers ::add-mask:: explicitly.
#   No `set -x`, no echo of the secret, no secret in URLs.
#
# Requires (after the Vercel project exists, needs approval):
#   * Vercel → Deployment Protection → Protection Bypass for Automation: generate a secret.
#   * GitHub repo secret VERCEL_AUTOMATION_BYPASS_SECRET = that value.
name: Preview checks

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.deployment.sha }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preview:
    name: preview-e2e
    # Successful Vercel *preview* deployments only ("Preview" or "Preview – <project>"),
    # created by the Vercel GitHub App.
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      github.event.deployment.creator.login == 'vercel[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
    steps:
      # Secret-bearing files live in $RUNNER_TEMP, outside the workspace and every upload path.
      - name: Set temp paths
        run: |
          {
            echo "PW_BYPASS_STATE=$RUNNER_TEMP/pw-bypass-state.json"
            echo "LHCI_TMP_CONFIG=$RUNNER_TEMP/lhci-preview.json"
            echo "SAFE_DIR=$RUNNER_TEMP/preview-safe"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      # No secret in env for install steps (F-09).
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check bypass secret is configured (presence only) and mask it
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +x
          if [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set; protected previews return 401."
            exit 1
          fi
          # Workflow command: the runner consumes this line and does not print it.
          echo "::add-mask::$VERCEL_AUTOMATION_BYPASS_SECRET"

      - name: Playwright e2e + axe against preview (traces/screenshots/video/HTML report off)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: pw-junit.xml
        run: |
          set +x
          npm run test:e2e -- --trace=off --reporter=list,github,junit

      - name: Lighthouse CI (lab, mobile) against preview - collect + assert only, no upload
        if: ${{ !cancelled() }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +x
          umask 077
          # Build the runtime config OUTSIDE the workspace; the committed lighthouserc.preview.json
          # holds no secret. Nothing is printed.
          node -e '
            const fs = require("fs");
            const rc = JSON.parse(fs.readFileSync("lighthouserc.preview.json", "utf8"));
            const origin = process.env.BASE_URL.replace(/\/$/, "");
            rc.ci.collect.url = rc.ci.collect.url.map((u) => u.replace("__BASE_URL__", origin));
            // Committed, non-secret headers (x-vercel-skip-toolbar) + the bypass header, merged
            // only in this temp file. extraHeaders may be a JSON string or an object.
            const settings = rc.ci.collect.settings || {};
            const base = typeof settings.extraHeaders === "string"
              ? JSON.parse(settings.extraHeaders) : (settings.extraHeaders || {});
            rc.ci.collect.settings = { ...settings, extraHeaders: JSON.stringify({ ...base,
              "x-vercel-protection-bypass": process.env.VERCEL_AUTOMATION_BYPASS_SECRET }) };
            delete rc.ci.upload;
            fs.writeFileSync(process.env.LHCI_TMP_CONFIG, JSON.stringify(rc), { mode: 0o600 });
          '
          status=0
          npx --yes @lhci/cli@0.15.1 collect --config="$LHCI_TMP_CONFIG" || status=$?
          if [ "$status" -eq 0 ]; then
            npx --yes @lhci/cli@0.15.1 assert --config="$LHCI_TMP_CONFIG" || status=$?
          fi
          rm -f "$LHCI_TMP_CONFIG"
          exit "$status"

      # Stage ONLY header-free result files, then prove they hold no secret before uploading.
      - name: Stage and scan safe results (tripwire)
        id: safe
        if: ${{ !cancelled() }}
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +x
          mkdir -p "$SAFE_DIR"
          [ -f pw-junit.xml ] && cp pw-junit.xml "$SAFE_DIR/"
          [ -f .lighthouseci/assertion-results.json ] && cp .lighthouseci/assertion-results.json "$SAFE_DIR/lhci-assertion-results.json"
          leak=0
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] && grep -rqF -- "$VERCEL_AUTOMATION_BYPASS_SECRET" "$SAFE_DIR"; then leak=1; fi
          # Bypass names only; the non-secret x-vercel-skip-toolbar header is intentionally not matched.
          if grep -rqiE -- 'x-vercel-protection-bypass|x-vercel-set-bypass-cookie|_vercel_jwt' "$SAFE_DIR"; then leak=1; fi
          if [ "$leak" -ne 0 ]; then
            rm -rf "$SAFE_DIR"
            echo "::error::Secret material found in staged results; nothing will be uploaded."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload header-free results
        if: ${{ !cancelled() && steps.safe.outputs.ok == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-results
          path: ${{ runner.temp }}/preview-safe
          retention-days: 1
          if-no-files-found: ignore

      - name: Cleanup secret-bearing files
        if: ${{ always() }}
        run: |
          rm -f "$PW_BYPASS_STATE" "$LHCI_TMP_CONFIG"
          rm -rf .lighthouseci lhci-report test-results playwright-report
